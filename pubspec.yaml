name: mobile_erp
description: Mobile ERP Management System
publish_to: "none"

version: 1.0.0+1

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.12.1
  flutter_dotenv: ^6.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.2.0
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  http: ^1.6.0
  excel: ^4.0.6
  archive: ^3.6.1
  file_picker: ^11.0.2
  path_provider: ^2.1.5
  share_plus: ^12.0.2
  file_selector: ^1.1.0
  shared_preferences: ^2.3.5
  url_launcher: ^6.3.0
  app_links: ^7.0.0


dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/icon/app_icon.png
