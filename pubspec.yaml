name: mobile_erp
description: Mobile ERP Management System
publish_to: "none"

version: 1.0.0+2026072701

environment:
  sdk: ">=3.4.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  supabase_flutter: ^2.17.2
  flutter_dotenv: ^6.0.1
  qr_flutter: ^4.1.0
  mobile_scanner: ^7.4.0
  geolocator: ^14.0.2
  image_picker: ^1.2.2
  http: ^1.6.0
  excel: ^4.0.6
  archive: ^3.6.1
  file_picker: 12.0.0-beta.7
  path_provider: ^2.1.5
  share_plus: ^13.3.0
  file_selector: ^1.1.0
  shared_preferences: ^2.4.28
  url_launcher: ^6.3.1
  app_links: ^7.0.0
  google_fonts: ^8.2.1
  pdf: ^3.12.0
  printing: ^5.14.3
  intl: ^0.19.0




dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  min_sdk_android: 21

flutter:
  uses-material-design: true

  assets:
    - assets/icon/app_icon.png
