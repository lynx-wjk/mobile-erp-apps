  <!-- Inline Critical Splash Screen CSS -->
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    html, body {
      width: 100%;
      height: 100%;
      background-color: #0b1329;
      color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      -webkit-font-smoothing: antialiased;
    }
    #app-shell {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      background-color: #0b1329;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      z-index: 99999;
      transition: opacity 0.3s ease-out;
      pointer-events: none;
    }
    .splash-box {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 16px;
    }
    .splash-logo-img {
      width: 56px;
      height: 56px;
      border-radius: 14px;
      object-fit: contain;
      box-shadow: 0 10px 25px -5px rgba(2, 132, 199, 0.35);
      animation: splash-pulse 2s infinite ease-in-out;
    }
    .splash-title {
      font-size: 17px;
      font-weight: 700;
      color: #f8fafc;
      letter-spacing: 0.3px;
    }
    .splash-progress-track {
      width: 140px;
      height: 3px;
      border-radius: 3px;
      background: rgba(255, 255, 255, 0.1);
      overflow: hidden;
      position: relative;
    }
    .splash-progress-bar {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 50%;
      background: linear-gradient(90deg, #38bdf8, #2563eb);
      border-radius: 3px;
      animation: splash-load 1.4s infinite ease-in-out;
    }
    @keyframes splash-pulse {
      0%, 100% { transform: scale(1); }
      50% { transform: scale(1.04); }
    }
    @keyframes splash-load {
      0% { left: -50%; width: 30%; }
      50% { left: 35%; width: 50%; }
      100% { left: 100%; width: 30%; }
    }
  </style>
</head>
<body>
  <!-- Clean Native App Splash Screen with Official Icon -->
  <div id="app-shell" aria-hidden="true">
    <div class="splash-box">
      <img src="favicon.png?v=2" alt="Mobile ERP Logo" class="splash-logo-img" width="56" height="56">
      <span class="splash-title">Mobile ERP</span>
      <div class="splash-progress-track">
        <div class="splash-progress-bar"></div>
      </div>
    </div>
  </div>

  <script>
    function dismissAppShell() {
      const shell = document.getElementById('app-shell');
      if (shell) {
        shell.style.opacity = '0';
        setTimeout(function() {
          if (shell.parentNode) {
            shell.parentNode.removeChild(shell);
          }
        }, 300);
      }
    }
    window.addEventListener('flutter-first-frame', dismissAppShell);
    window.addEventListener('load', function() {
      setTimeout(function() {
        const hasCanvas = document.querySelector('flutter-view, flt-glass-pane, canvas');
        if (hasCanvas) dismissAppShell();
      }, 2500);
    });
  </script>
  <script src="flutter_bootstrap.js?v=20260902_0228" async></script>
</body>
</html>
